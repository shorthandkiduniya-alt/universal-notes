<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Offline Notes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8e6216">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fffcf4; color: #333; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f0e6d2; padding-bottom: 10px; }
        .title { font-size: 22px; font-weight: bold; color: #8e6216; }
        .status { font-size: 12px; color: #999; background: #f3ebd9; padding: 4px 10px; border-radius: 12px; font-weight: 500; }
        textarea { width: 100%; flex: 1; border: none; background: transparent; font-size: 18px; line-height: 1.6; outline: none; resize: none; color: #222; }
    </style>
</head>
<body>

<div class="header">
    <div class="title">📝 Universal Notes</div>
    <div class="status" id="statusText">Saved Offline</div>
</div>

<textarea id="noteArea" placeholder="Yahan likhna shuru karein (Automatic save hoga)..."></textarea>

<script>
    const noteArea = document.getElementById('noteArea');
    const statusText = document.getElementById('statusText');

    window.addEventListener('DOMContentLoaded', () => {
        const savedNote = localStorage.getItem('universal_private_note');
        if (savedNote) noteArea.value = savedNote;
    });

    noteArea.addEventListener('input', () => {
        localStorage.setItem('universal_private_note', noteArea.value);
        statusText.innerText = "Typing...";
        clearTimeout(window.saveTimer);
        window.saveTimer = setTimeout(() => { statusText.innerText = "Saved Offline"; }, 400);
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
